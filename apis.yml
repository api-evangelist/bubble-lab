aid: bubble-lab
name: Bubble Lab
description: >-
  Bubble Lab is an open-core, agentic workflow automation platform built for
  developers. Its open-source (Apache-2.0) TypeScript engine lets you compose AI
  agents and integrations as typed, composable units called "Bubbles" — service
  bubbles (Slack, Gmail, PostgreSQL, Google Sheets, Airtable, ElevenLabs, Resend,
  and more) and tool bubbles (web scraping, research agents, SQL, LinkedIn,
  Reddit, YouTube) — then stitches them into production-grade "BubbleFlow"
  pipelines with end-to-end type safety, built-in logging, tracing, and
  step-level observability. Workflows are fully runnable, self-hostable, and
  exportable to your own backend, or authored visually in the hosted Bubble
  Studio. Scaffold a project in seconds with the create-bubblelab-app CLI.
  Backed by Y Combinator (W26).
